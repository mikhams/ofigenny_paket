[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "greetings"
version = "0.1.0"
description = "A package with greetings in different languages"
readme = "README.md"
requires-python = ">=3.9"
[tool.hatch.build.targets.wheel]
packages = ["src/greetings"]  